<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Luma Phone Cam</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c19;color:#eef3ff}body{--cyan:#21deee;--mint:#20f0b2}.screen{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#122441 0%,#0b1122 48%,#080b17 100%)}.glow{position:absolute;width:56vmin;height:56vmin;border-radius:50%;background:#11d7eb;filter:blur(110px);opacity:.11}.audio-view{z-index:1;width:min(78%,920px);text-align:center}.brand{font-size:clamp(18px,3vw,34px);letter-spacing:.22em;font-weight:800;color:var(--cyan)}.state{display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:10px 16px;border:1px solid #34415d;border-radius:999px;background:#11192c;color:#acbad2;font-size:clamp(10px,1.2vw,14px);letter-spacing:.13em}.dot{width:8px;height:8px;border-radius:50%;background:#59627c}.connected .dot{background:var(--mint);box-shadow:0 0 14px var(--mint)}.wave{display:flex;align-items:center;justify-content:center;gap:clamp(2px,.5vw,7px);height:min(18vh,150px);margin:3vh auto 0}.bar{width:clamp(3px,.55vw,8px);height:8px;border-radius:10px;background:linear-gradient(180deg,#32f1ec,#10b9dc);opacity:.8;transition:height 65ms linear}.foot{margin-top:4vh;color:#7787a3;font-size:clamp(9px,1vw,12px);letter-spacing:.18em}.start{margin-top:20px;border:1px solid #23758a;color:#e9fcff;background:#112335;border-radius:12px;padding:12px 18px;font-size:13px;letter-spacing:.1em;cursor:pointer}.camera-view{position:absolute;inset:0;background:#05070d}.camera-view img{width:100%;height:100%;object-fit:contain;background:#05070d}.camera-view .state{position:absolute;left:24px;top:20px;margin:0;background:#0b1022cc}.camera-view .brand{position:absolute;right:26px;bottom:22px;font-size:clamp(12px,1.8vw,22px);text-shadow:0 2px 14px #000}.hidden{display:none!important}
</style></head>
<body><main class="screen" id="screen"><div class="glow"></div><section class="audio-view" id="audioView"><div class="brand">LUMA <span style="color:#f1f4ff">PHONE CAM</span></div><div class="state" id="state"><i class="dot"></i><span id="stateText">WAITING FOR PHONE</span></div><div class="wave" id="wave"></div><div class="foot">DIRECT PCM · 48 KHZ · OBS STUDIO</div><button class="start hidden" id="start">START AUDIO</button></section><section class="camera-view hidden" id="cameraView"><img id="camera" alt="Luma live camera"><div class="state" id="cameraState"><i class="dot"></i><span>WAITING FOR CAMERA</span></div><div class="brand">LUMA</div></section></main>
<script>
(()=>{const q=new URLSearchParams(location.search), view=q.get('source')||'audio';const av=document.getElementById('audioView'),cv=document.getElementById('cameraView');if(view==='camera'){av.classList.add('hidden');cv.classList.remove('hidden');const img=document.getElementById('camera'),camState=document.getElementById('cameraState');img.onload=()=>{camState.classList.add('connected');camState.querySelector('span').textContent='CAMERA LIVE'};img.onerror=()=>setTimeout(()=>{camState.classList.remove('connected');camState.querySelector('span').textContent='WAITING FOR CAMERA';img.src='/video.mjpg?retry='+Date.now()},1000);img.src='/video.mjpg';return;}
const wave=document.getElementById('wave');const bars=[];for(let i=0;i<64;i++){const b=document.createElement('i');b.className='bar';wave.appendChild(b);bars.push(b)}const state=document.getElementById('state'),stateText=document.getElementById('stateText'),start=document.getElementById('start');let ctx=null,ws=null,nextTime=0,lastLevel=0;
function connect(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive',sampleRate:48000});ctx.resume().then(()=>{if(ctx.state==='running')start.classList.add('hidden');else{start.textContent='CLICK TO ENABLE AUDIO';start.classList.remove('hidden')}}).catch(()=>{start.textContent='CLICK TO ENABLE AUDIO';start.classList.remove('hidden')});ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/audio.ws');ws.binaryType='arraybuffer';ws.onopen=()=>{state.classList.add('connected');stateText.textContent='LIVE · LOW-LATENCY AUDIO';if(ctx.state==='running')start.classList.add('hidden');else{start.textContent='CLICK TO ENABLE AUDIO';start.classList.remove('hidden')}nextTime=ctx.currentTime+.035};ws.onclose=()=>{state.classList.remove('connected');stateText.textContent='RECONNECTING TO PHONE';setTimeout(connect,700)};ws.onerror=()=>{try{ws.close()}catch(e){}};ws.onmessage=e=>{if(!ctx||!e.data||e.data.byteLength<2)return;const n=e.data.byteLength>>1,view=new DataView(e.data),buffer=ctx.createBuffer(1,n,48000),samples=buffer.getChannelData(0),step=Math.max(1,Math.floor(n/96));let power=0;for(let i=0;i<n;i++){const s=view.getInt16(i*2,true)/32768;samples[i]=s;if(i%step===0)power+=s*s}lastLevel=Math.min(1,Math.sqrt(power/Math.ceil(n/step))*3.2);let when=Math.max(nextTime,ctx.currentTime+.004);if(when-ctx.currentTime>.16)when=ctx.currentTime+.025;const src=ctx.createBufferSource();src.buffer=buffer;src.connect(ctx.destination);src.start(when);nextTime=when+n/48000;};}catch(e){stateText.textContent='AUDIO START FAILED';start.classList.remove('hidden')}}
start.addEventListener('click',()=>{if(ctx)ctx.resume().then(()=>start.classList.add('hidden'));if(!ws||ws.readyState===WebSocket.CLOSED)connect()});connect();function draw(){const t=performance.now()/400;for(let i=0;i<bars.length;i++){const env=.16+lastLevel*(.35+.65*Math.abs(Math.sin(i*.37+t)));bars[i].style.height=(5+env*72+Math.abs(Math.sin(i*.21-t*.7))*8)+'%'}requestAnimationFrame(draw)}draw();})();
</script></body></html>
